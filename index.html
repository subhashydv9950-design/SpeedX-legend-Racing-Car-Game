<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Rush – Super Car Racing</title>
<style>
:root{--bg:#0b0f1a;--fg:#fff;--panel:rgba(8,12,22,.72);--btn:rgba(255,255,255,.14);--acc:#ff3b3b;--gold:#ffd23b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f1a;--fg:#fff}}
:root[data-theme="dark"]{--bg:#0b0f1a;--fg:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas#c3{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:var(--fg);background:var(--btn);border:0;border-radius:14px;padding:10px 14px;font-weight:700;touch-action:none}
button.on{background:var(--acc)}
/* HOME */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(5,8,16,.55),rgba(5,8,16,.2) 50%,rgba(5,8,16,.7));padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.logo{font-size:clamp(40px,9vw,76px);font-weight:900;font-style:italic;letter-spacing:2px;line-height:1}
.logo span{color:var(--acc);margin-left:10px}
.tag{letter-spacing:6px;font-size:12px;opacity:.85;margin:6px 0 18px}
.menu{display:grid;grid-template-columns:repeat(2,minmax(130px,170px));gap:10px}
.mbtn{padding:14px;font-size:15px;background:var(--panel);border:1px solid rgba(255,255,255,.18)}
.mbtn.pri{grid-column:1/3;background:linear-gradient(90deg,#e01b24,#ff6a3b);font-size:20px;padding:16px;border:0}
.pill{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;background:var(--panel);padding:8px 12px}
#modal{background:rgba(5,8,16,.78);z-index:40}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:16px;width:min(92vw,460px);max-height:86%;overflow:auto;touch-action:pan-y}
.card h2{margin:0 0 10px;font-size:20px;letter-spacing:2px}
.row{margin:10px 0}.row label{display:block;font-size:12px;opacity:.75;margin-bottom:5px;letter-spacing:1px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px 4px;font-size:13px}
.col{display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);background:var(--panel);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none}
/* HUD */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
#menuBtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;width:46px;height:46px;border-radius:50%;padding:0;font-size:20px;background:var(--panel)}
#mini{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:104px;height:104px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:#0a0f18;pointer-events:none}
#gauge{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 4px);width:200px;height:155px;pointer-events:none}
#bottom{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;pointer-events:none}
#bottom>*{pointer-events:auto}
#bottom.swap{flex-direction:row-reverse}
.grp{display:flex;gap:10px;align-items:flex-end}
.big{width:78px;height:78px;border-radius:50%;font-size:14px;padding:0}
#bL,#bR{font-size:26px}
#gas{background:rgba(59,255,138,.38);height:96px;width:86px;border-radius:44px}
#brk{background:rgba(255,59,59,.38)}
#gas.on{background:#2fd873}
#shift{display:flex;flex-direction:column;gap:6px}
#shift button{padding:8px 10px;font-size:12px;min-width:54px;background:var(--panel)}
#wheel{width:130px;height:130px;touch-action:none}
#wheel svg{width:100%;height:100%;display:block}
@media (max-aspect-ratio:1/1){#gauge{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}}
#hint{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--panel);padding:12px 18px;border-radius:14px;text-align:center;font-weight:600;transition:opacity .6s;z-index:6;pointer-events:none}
#flash{position:fixed;inset:0;background:#f00;opacity:0;pointer-events:none;z-index:4;transition:opacity .25s}
</style>
</head>
<body>
